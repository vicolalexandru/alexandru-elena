<!doctype html>

    <meta charset="UTF-8" />
    <!--
      GitHub Pages SPA fallback restore (spa-github-pages technique).
      Decodes the "/?/path" produced by public/404.html back into a clean
      URL before React mounts, so React Router sees deep links like /upload.
    -->
    <script type="text/javascript">
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
